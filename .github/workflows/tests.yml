# Führt die Tests bei jedem Push und jedem Pull Request aus.
# Die Tests brauchen kein Netz: OSM, Gelände und amtliche Daten kommen aus tests/fixtures.py.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Pakete installieren
        run: pip install -r requirements-dev.txt
      - name: Tests
        run: python -m pytest -v
