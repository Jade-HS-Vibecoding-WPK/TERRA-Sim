# Baut TERRA-Sim als Windows-Programm (Installer + portable ZIP).
#
# * Tag „v*“ (z. B. v1.0) -> GitHub-Release mit beiden Dateien
# * Pull Request, der die Desktop-App betrifft -> nur bauen und prüfen (Dateien als Artefakt)
# * von Hand (workflow_dispatch) -> bauen und prüfen
name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "desktop/**"
      - ".github/workflows/release.yml"
      - "requirements.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Pakete installieren
        run: pip install -r requirements-dev.txt "pyinstaller>=6.10"

      - name: Tests
        run: python -m pytest -q

      - name: Versionsnummer
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(python -c 'from modules.version import __version__ as v; print(v)')-test"
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "Version: $version"

      - name: Programm bauen (PyInstaller)
        run: |
          python desktop/make_icon.py
          pyinstaller desktop/terra-sim.spec --noconfirm --clean --log-level WARN

      - name: Selbsttest des Programms
        shell: pwsh
        run: |
          $p = Start-Process dist\TERRA-Sim\TERRA-Sim.exe -ArgumentList "--selftest", "`"$PWD\selftest.txt`"" -Wait -PassThru
          Get-Content selftest.txt
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: Server startet
        shell: pwsh
        run: |
          $server = Start-Process dist\TERRA-Sim\TERRA-Sim.exe -ArgumentList "--server", "8599" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 90 -and -not $ok; $i++) {
            Start-Sleep -Seconds 2
            try { $ok = (Invoke-WebRequest http://127.0.0.1:8599/_stcore/health -UseBasicParsing -TimeoutSec 2).Content -eq "ok" } catch {}
          }
          if ($ok) { $page = Invoke-WebRequest http://127.0.0.1:8599/ -UseBasicParsing; $ok = $page.Content -match "<title>" }
          Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
          Get-Content "$env:LOCALAPPDATA\TERRA-Sim\server.log" -ErrorAction SilentlyContinue | Select-Object -Last 30
          if (-not $ok) { Write-Error "Der Server von TERRA-Sim ist nicht gestartet."; exit 1 }

      - name: Portable ZIP
        shell: pwsh
        run: Compress-Archive -Path dist\TERRA-Sim -DestinationPath "dist\TERRA-Sim-$env:VERSION-Windows-portabel.zip"

      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc "/DAppVersion=$env:VERSION" desktop\installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Installer testen (langer Zielordner)
        shell: pwsh
        run: |
          # Zielordner mit 140 Zeichen: Alle Pfade im Programm müssen trotzdem unter der
          # Windows-Grenze von 260 Zeichen bleiben (sonst bricht der Installer ab).
          $prefix = Join-Path $env:RUNNER_TEMP "installtest"
          $target = Join-Path (Join-Path $prefix ("x" * (140 - $prefix.Length - 11))) "TERRA-Sim"
          "Zielordner: $($target.Length) Zeichen"
          $setup = (Get-ChildItem dist\TERRA-Sim-*-Setup.exe | Select-Object -First 1).FullName
          $log = Join-Path $env:RUNNER_TEMP "install.log"
          $p = Start-Process $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", '/TASKS=""', "/DIR=`"$target`"", "/LOG=`"$log`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content $log -Tail 25; Write-Error "Installation fehlgeschlagen (Code $($p.ExitCode))"; exit 1 }
          $report = Join-Path $env:RUNNER_TEMP "selftest-installiert.txt"
          $t = Start-Process "$target\TERRA-Sim.exe" -ArgumentList "--selftest", "`"$report`"" -Wait -PassThru
          Get-Content $report
          $u = Start-Process "$target\unins000.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait -PassThru
          if ($t.ExitCode -ne 0) { Write-Error "Selbsttest im installierten Programm fehlgeschlagen"; exit 1 }
          if ($u.ExitCode -ne 0) { Write-Error "Deinstallation fehlgeschlagen"; exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: TERRA-Sim-${{ env.VERSION }}-Windows
          path: |
            dist/TERRA-Sim-*-Setup.exe
            dist/TERRA-Sim-*-Windows-portabel.zip
          retention-days: 14

      - name: Release veröffentlichen
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: TERRA-Sim ${{ env.VERSION }}
          body_path: desktop/RELEASE_NOTES.md
          files: |
            dist/TERRA-Sim-*-Setup.exe
            dist/TERRA-Sim-*-Windows-portabel.zip
