# Veröffentlicht die Live-Demo (demo/ + 3D-Viewer) auf GitHub Pages.
# Die Demo-Daten in demo/data/ werden lokal mit scripts/build_demo.py erzeugt und eingecheckt –
# das Rechnen braucht OpenStreetMap, DGM1 und die amtlichen Dienste und gehört nicht in jeden Lauf.
name: Live-Demo

on:
  push:
    branches: [main]
    paths:
      - "demo/**"
      - "modules/viewer_webgpu/frontend/**"
      - "assets/icon.svg"
      - "assets/logo.svg"
      - "scripts/assemble_demo.sh"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Seite zusammenbauen
        run: sh scripts/assemble_demo.sh _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
